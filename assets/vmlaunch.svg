<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" ry="20" fill="url(#bg)" />
  <!-- Windows 11 multicolor logo (four panes with perspective skew) -->
  <g transform="translate(24, 28)">
    <!-- Top-left pane (blue) -->
    <polygon points="0,6.4 36,0 36,34 0,34" fill="#05A6F0" />
    <!-- Top-right pane (green) -->
    <polygon points="40,0 80,0 80,34 40,34" fill="#81BC06" />
    <!-- Bottom-left pane (yellow) -->
    <polygon points="0,38 36,38 36,72 0,65.6" fill="#FFBA08" />
    <!-- Bottom-right pane (red) -->
    <polygon points="40,38 80,38 80,72 40,72" fill="#F35325" />
  </g>
</svg>
